# Nightly checks (SPEC-0004, ADR-0009, ADR-0012): long RTP simulations (tests marked Category=Nightly) and mutation
# testing of Fairness.Domain (SPEC-0016: the Category=Mutation test runs Stryker with stryker-config.json once and
# asserts the score). 03:00 UTC, also runnable by hand.
# To save Actions minutes, the scheduled run does nothing when main had no commit in the last 24 hours (the code was
# already checked by the previous night); a manual run always executes.
# Every action is pinned by full commit SHA (tag in the comment); tools/ci/check-workflows enforces it.
name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.commits.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so `git log --since` sees every commit of the window
          persist-credentials: false
      - name: Commits in the last 24 hours
        id: commits
        env:
          EVENT: ${{ github.event_name }}
        run: |
          count=$(git log --since=24.hours --format=%H | wc -l | tr -d ' ')
          echo "Commits on ${GITHUB_REF_NAME} in the last 24 hours: $count"
          if [ "$EVENT" = "schedule" ] && [ "$count" -eq 0 ]; then
            echo "::notice::No commit in the last 24 hours; nightly checks skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  rtp-simulation:
    needs: recent
    if: needs.recent.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore (lock files, locked mode)
        run: dotnet restore Apogeu.slnx --locked-mode
      - name: Build (warnings are errors)
        run: dotnet build Apogeu.slnx -c Release --no-restore
      # The mutation test is also Category=Nightly; it runs only in the `mutation` job (SPEC-0016 amendment 1).
      - name: RTP simulation (Category=Nightly, without Mutation)
        run: >-
          dotnet test Apogeu.slnx -c Release --no-build
          --filter "Category=Nightly&Category!=Mutation"
          --logger "trx"
          --results-directory artifacts/nightly
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-rtp
          path: artifacts/nightly
          retention-days: 7
          if-no-files-found: ignore

  mutation:
    needs: recent
    if: needs.recent.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore (lock files, locked mode, local tools)
        run: |
          dotnet restore Apogeu.slnx --locked-mode
          dotnet tool restore
      - name: Build the CI tests (warnings are errors)
        run: dotnet build tests/ci/Ci.Tests/Ci.Tests.csproj -c Release --no-restore
      # stryker-config.json mutates Fairness.Domain with Fairness.Tests and breaks below 85% (SPEC-0007 §7.6); the
      # Category=Mutation test runs Stryker on it and fails on a low score or uncovered SeedChain.cs mutants. The
      # Stryker output (statuses per mutant) is in the test log of the trx.
      # xUnit v3 runs the tests in a child process of the vstest host, out of reach of Stryker's in-process data
      # collector, so the mutant is activated through the environment instead: STRYKER_MUTANT_ID_CONTROL_VAR names
      # the variable the single vstest runner (concurrency 1 in stryker-config.json) sets per mutant (SPEC-0016).
      - name: Mutation (Category=Mutation, Stryker, break below 85%)
        env:
          STRYKER_MUTANT_ID_CONTROL_VAR: ACTIVE_MUTATION_0
        run: >-
          dotnet test tests/ci/Ci.Tests/Ci.Tests.csproj -c Release --no-build
          --filter "Category=Mutation"
          --logger "trx"
          --results-directory artifacts/mutation
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-results
          path: artifacts/mutation
          retention-days: 7
          if-no-files-found: ignore
