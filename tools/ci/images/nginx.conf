# Static single-page app: unknown paths fall back to index.html; hashed assets are cached for a long time.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
